<!DOCTYPE html>

<head th:replace="~{fragments/head :: head('Sin acceso')}"></head>
<body>
<!-- P-07: textos provisionales de la pantalla 403. -->
<main class="error-page">
    <div class="card error-card" data-testid="pantalla-403">
        <span class="disc"><span class="icon" aria-hidden="true">lock</span></span>
        <h1>No tienes acceso a esta página</h1>
        <p>Tu cuenta no está autorizada para ver esto. Si crees que es un error, vuelve al inicio.</p>

    </div>
</main>
</body>
</html>
