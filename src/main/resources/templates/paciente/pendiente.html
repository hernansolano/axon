<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/paciente-marco :: marco(${etiqueta}, ${activo}, ~{::main})}">
<body>
<!--
  Marco de una pantalla que todavía no tiene lógica. Título y subtítulo ya son los del diseño v4;
  el bloque "pendiente" desaparece cuando el hito indicado conecta la pantalla.
-->
<main class="app-main">
    <div class="page">
        <div class="page-head">
            <div class="stack">
                <span class="eyebrow" th:classappend="${activo == 'emergencia'} ? 'danger'" th:text="${etiqueta}">Permisos</span>
                <h1 class="title-serif" data-testid="titulo-pantalla" th:text="${titulo}">Título</h1>
                <p class="lede" th:text="${subtitulo}">Subtítulo</p>
            </div>
        </div>
        <div class="card pending" data-testid="pantalla-pendiente" th:attr="data-hito=${hito}">
            <span class="badge"><span class="icon" aria-hidden="true">construction</span></span>
            <div>
                <strong>Esta pantalla se conecta en <span th:text="${hito}">H3</span></strong>
                <span>La navegación y el diseño ya están; falta la lógica de negocio de este hito (ver PLAN.md).</span>
            </div>
        </div>
    </div>
</main>
</body>
</html>
